aid: neuralmagic
name: NeuralMagic
description: >-
  Neural Magic was an AI software company that spun out of MIT in 2018 to build
  high-performance deep learning inference software. Its flagship open-source
  products were DeepSparse, a sparsity-aware inference runtime delivering
  GPU-class performance on commodity CPUs, together with SparseML, SparseZoo, and
  Sparsify for model compression, sparsification recipes, and a curated model
  repository, plus nm-vllm, an enterprise LLM inference server for GPUs. Neural
  Magic was a prolific contributor to the community vLLM project. The company was
  acquired by Red Hat (agreement announced November 2024, completed January 2025)
  and its engineering now advances vLLM and Red Hat AI. The community versions of
  DeepSparse, SparseML, SparseZoo, and Sparsify were deprecated on 2026-06-02.
  Neural Magic exposed no commercial REST API; its developer surface was a set of
  first-party Python libraries published to PyPI and open source on GitHub.
